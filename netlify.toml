[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Nitro writes the SSR handler to .netlify/functions-internal/server.
# Static files in dist/ win first; everything else hits the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
